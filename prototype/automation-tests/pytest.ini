[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    auth: Authentication tests
    access: Role-based access tests
    guardrail: Guardrail tests
    audit: Audit logging tests
    admin: Admin API tests
    fail_secure: Fail-secure tests
    metadata: Metadata isolation tests
    edge: Edge case tests
