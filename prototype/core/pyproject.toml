[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-system-core"
version = "0.1.0"
description = "FastAPI service with OAuth2, access control, and RAG chain"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.26",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.0.38",
    "openai>=1.12",
    "pgvector>=0.2.0",
    "pydantic-settings>=2.1",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.26",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
